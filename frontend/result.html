<!-- WayVista Result Component Template -->
<div class="card result-card">
    <div class="result-header">
        <span class="pill-badge"><i class="fa-solid fa-check-circle"></i> Prediction Result</span>
        <h3 id="res-route-title">Mumbai <i class="fa-solid fa-arrow-right"></i> Pune</h3>
        <p class="text-muted">Travel time estimated using Ridge & Lasso ML models</p>
    </div>

    <div class="eta-box">
        <div class="eta-label">Estimated Travel Time</div>
        <div class="eta-value" id="res-duration">-- mins</div>
        <div class="eta-subtext">Estimated Arrival Time (ETA): <strong id="res-eta">--:--</strong></div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <i class="fa-solid fa-road stat-icon icon-blue"></i>
            <div>
                <span class="stat-label">Distance</span>
                <div class="stat-value" id="res-distance">-- km</div>
            </div>
        </div>

        <div class="stat-card">
            <i class="fa-solid fa-cloud-sun stat-icon icon-amber"></i>
            <div>
                <span class="stat-label">Weather</span>
                <div class="stat-value" id="res-weather">--</div>
            </div>
        </div>

        <div class="stat-card">
            <i class="fa-solid fa-car stat-icon icon-red"></i>
            <div>
                <span class="stat-label">Traffic</span>
                <div class="stat-value" id="res-traffic">--</div>
            </div>
        </div>

        <div class="stat-card">
            <i class="fa-solid fa-temperature-three-quarters stat-icon icon-green"></i>
            <div>
                <span class="stat-label">Temperature</span>
                <div class="stat-value" id="res-temp">-- °C</div>
            </div>
        </div>
    </div>
</div>
